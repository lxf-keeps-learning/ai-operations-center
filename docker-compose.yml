services:
  postgres:
    image: postgres:16
    container_name: ai-operations-center-langgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LANGGRAPH_POSTGRES_DB:-langgraph}
      POSTGRES_USER: ${LANGGRAPH_POSTGRES_USER:-langgraph}
      POSTGRES_PASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD:-langgraph_password}
      TZ: Asia/Shanghai
    ports:
      - "${LANGGRAPH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - langgraph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGGRAPH_POSTGRES_USER:-langgraph} -d ${LANGGRAPH_POSTGRES_DB:-langgraph}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: ai-operations-center-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ioc_ai}
      MYSQL_USER: ${MYSQL_USER:-ioc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ioc_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-ioc_user} -p${MYSQL_PASSWORD:-ioc_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  langgraph_postgres_data:
